<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Semantic Lenia: Synchronized PCA & EKG Dashboard</title>
        <script src="https://cdn.plot.ly/plotly-2.24.1.min.js"></script>
        <style>
            body {
                background-color: #0d1117;
                color: #c9d1d9;
                font-family: sans-serif;
                text-align: center;
            }
            #dashboard {
                width: 95%;
                max-width: 1400px;
                height: 800px;
                margin: 0 auto;
            }
            #text-box {
                margin: 20px auto;
                padding: 20px;
                width: 85%;
                max-width: 1200px;
                background: #161b22;
                border: 1px solid #30363d;
                border-radius: 6px;
                text-align: left;
                font-size: 1.1em;
                line-height: 1.5;
                min-height: 80px;
                box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            }
            .highlight {
                color: #39ff14;
                font-weight: bold;
            }
        </style>
    </head>
    <body>
        <h2>Semantic Lenia: Synchronized PCA & EKG Dashboard</h2>
        <h3>
            Turing Soliton (Llama-3.1-70B: 4-bit quantization, α=30.0, μ=0.49,
            σ=0.03)
        </h3>

        <div id="dashboard"></div>
        <div id="text-box">
            <span style="color: #8b949e"
                >Generated text will appear here...</span
            >
        </div>

        <script>
            json_path = "./turing_soliton_70b_mu_0-49_sigma_0-03.json";

            fetch(json_path)
                .then((response) => response.json())
                .then((data) => {
                    const traj = data.trajectory;
                    const target = data.target_centroid;
                    const params = data.parameters;

                    const steps = [],
                        x_vals = [],
                        y_vals = [],
                        u_vals = [],
                        ppl_vals = [],
                        text_vals = [];

                    traj.forEach((d) => {
                        steps.push(d.step);
                        x_vals.push(d.x);
                        y_vals.push(d.y);
                        u_vals.push(d.u);
                        ppl_vals.push(d.ppl);
                        text_vals.push(d.token);
                    });

                    const maxStep = Math.max(...steps);
                    const delta = params.sigma * Math.sqrt(2 * Math.log(2));

                    const traceTarget = {
                        x: [target.x],
                        y: [target.y],
                        mode: "markers",
                        marker: { symbol: "star", size: 15, color: "gold" },
                        name: "Target (k)",
                    };
                    const tracePCA = {
                        x: [x_vals[0]],
                        y: [y_vals[0]],
                        mode: "lines+markers",
                        line: { color: "#39FF14", width: 2 },
                        marker: { size: 6, color: "#39FF14" },
                        name: "Orbit (c_t)",
                    };
                    const traceU = {
                        x: [0],
                        y: [u_vals[0]],
                        xaxis: "x2",
                        yaxis: "y2",
                        mode: "lines",
                        line: { color: "#39FF14", width: 2 },
                        name: "U_t",
                    };
                    const tracePPL = {
                        x: [0],
                        y: [ppl_vals[0]],
                        xaxis: "x3",
                        yaxis: "y3",
                        mode: "lines",
                        line: { color: "#FF007F", width: 2 },
                        name: "PPL",
                    };

                    const layout = {
                        plot_bgcolor: "#0d1117",
                        paper_bgcolor: "#0d1117",
                        font: { color: "#c9d1d9" },
                        showlegend: false,
                        // 🌟 X軸ラベルとスライダーが被らないよう下部余白をさらに拡大
                        margin: { t: 30, b: 150, l: 60, r: 40 },

                        xaxis: {
                            domain: [0.15, 0.85],
                            title: "PC 1",
                            showgrid: true,
                            gridcolor: "#21262d",
                            range: [
                                Math.min(...x_vals) - 0.1,
                                Math.max(...x_vals) + 0.1,
                            ],
                        },
                        yaxis: {
                            domain: [0.45, 1.0],
                            title: "PC 2",
                            showgrid: true,
                            gridcolor: "#21262d",
                            range: [
                                Math.min(...y_vals) - 0.1,
                                Math.max(...y_vals) + 0.1,
                            ],
                        },
                        xaxis2: {
                            domain: [0, 0.45],
                            anchor: "y2",
                            title: "Time Step (Tokens)",
                            showgrid: true,
                            gridcolor: "#21262d",
                            range: [0, maxStep],
                        },
                        yaxis2: {
                            domain: [0, 0.3],
                            anchor: "x2",
                            title: "Semantic Alignment (Ut)",
                            showgrid: true,
                            gridcolor: "#21262d",
                            range: [
                                Math.min(...u_vals) - 0.05,
                                Math.max(...u_vals) + 0.05,
                            ],
                        },
                        xaxis3: {
                            domain: [0.55, 1],
                            anchor: "y3",
                            title: "Time Step (Tokens)",
                            showgrid: true,
                            gridcolor: "#21262d",
                            range: [0, maxStep],
                        },
                        yaxis3: {
                            domain: [0, 0.3],
                            anchor: "x3",
                            title: "Perplexity (Log)",
                            type: "log",
                            showgrid: true,
                            gridcolor: "#21262d",
                            range: [0, Math.log10(Math.max(...ppl_vals) * 2)],
                        },

                        shapes: [
                            {
                                type: "line",
                                xref: "x2",
                                yref: "y2",
                                x0: 0,
                                x1: maxStep,
                                y0: params.mu,
                                y1: params.mu,
                                line: { color: "gold", width: 1, dash: "dash" },
                            },
                            {
                                type: "line",
                                xref: "x2",
                                yref: "y2",
                                x0: 0,
                                x1: maxStep,
                                y0: params.mu - delta,
                                y1: params.mu - delta,
                                line: { color: "cyan", width: 1, dash: "dot" },
                            },
                        ],
                    };

                    const frames = [];
                    const sliderSteps = [];

                    for (let i = 0; i < traj.length; i++) {
                        frames.push({
                            name: i.toString(),
                            data: [
                                traceTarget,
                                {
                                    x: x_vals.slice(0, i + 1),
                                    y: y_vals.slice(0, i + 1),
                                },
                                {
                                    x: steps.slice(0, i + 1),
                                    y: u_vals.slice(0, i + 1),
                                },
                                {
                                    x: steps.slice(0, i + 1),
                                    y: ppl_vals.slice(0, i + 1),
                                },
                            ],
                        });

                        sliderSteps.push({
                            label: i.toString(),
                            method: "animate",
                            args: [
                                [i.toString()],
                                {
                                    mode: "immediate",
                                    transition: { duration: 0 },
                                    frame: { duration: 0, redraw: false },
                                },
                            ],
                        });
                    }

                    // 🌟 ボタンとスライダーを一直線に並べるための座標調整
                    layout.updatemenus = [
                        {
                            x: -0.05,
                            y: -0.15, // グラフ領域からしっかり下へ離す
                            xanchor: "left",
                            yanchor: "top",
                            type: "buttons",
                            showactive: false,
                            direction: "right", // ボタンを横並びに
                            pad: { t: 0, r: 10 },
                            buttons: [
                                {
                                    label: "▶ Play",
                                    method: "animate",
                                    args: [
                                        null,
                                        {
                                            fromcurrent: true,
                                            transition: { duration: 0 },
                                            frame: {
                                                duration: 100,
                                                redraw: false,
                                            },
                                        },
                                    ],
                                },
                                {
                                    label: "⏸ Pause",
                                    method: "animate",
                                    args: [
                                        [null],
                                        {
                                            mode: "immediate",
                                            transition: { duration: 0 },
                                            frame: {
                                                duration: 0,
                                                redraw: false,
                                            },
                                        },
                                    ],
                                },
                            ],
                        },
                    ];
                    layout.sliders = [
                        {
                            x: 0.25, // ボタンの右隣からスライダーを開始
                            y: -0.12, // ボタンと同じY座標
                            xanchor: "left",
                            yanchor: "top",
                            len: 0.75, // 残りの幅いっぱいを使う
                            pad: { t: 0, l: 0 },
                            currentvalue: {
                                visible: true,
                                prefix: "Token Step: ",
                                font: { color: "#c9d1d9" },
                            },
                            steps: sliderSteps,
                        },
                    ];

                    Plotly.newPlot(
                        "dashboard",
                        [traceTarget, tracePCA, traceU, tracePPL],
                        layout,
                    ).then(function () {
                        Plotly.addFrames("dashboard", frames);
                    });

                    const textBox = document.getElementById("text-box");
                    document
                        .getElementById("dashboard")
                        .on("plotly_animatingframe", function (e) {
                            const stepIdx = parseInt(e.name);
                            const highlightedText =
                                text_vals
                                    .slice(0, stepIdx)
                                    .join("")
                                    .replace(/\n/g, "<br>") +
                                `<span class="highlight">${text_vals[stepIdx].replace(/\n/g, "<br>")}</span>`;
                            textBox.innerHTML = highlightedText;
                        });
                });
        </script>
    </body>
</html>
